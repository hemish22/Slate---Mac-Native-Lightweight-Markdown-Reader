name: Release Slate
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Run tests
        run: make test
      - name: Build universal app and checksum
        env:
          SLATE_BUILD_ARCHS: arm64 x86_64
        run: make package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/Slate.zip build/SHA256SUMS \
            --verify-tag --title "Slate $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
