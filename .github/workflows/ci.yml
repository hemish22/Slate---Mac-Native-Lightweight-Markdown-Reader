name: macOS build and tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run tests
        run: make test
      - name: Build universal app
        env:
          SLATE_BUILD_ARCHS: arm64 x86_64
        run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: Slate-universal
          path: |
            build/Slate.zip
            build/SHA256SUMS
